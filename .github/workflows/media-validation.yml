name: Media URL validation
on:
  pull_request:
  push:
    branches: [fix/preserve-media-url-paths]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/*.test.mjs
      - run: npx tsc --noEmit
